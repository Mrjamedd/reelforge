services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: reelpush
      POSTGRES_PASSWORD: reelpush
      POSTGRES_DB: reelpush
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reelpush"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      API_URL: http://localhost:8100
      DATABASE_URL: postgresql+asyncpg://reelpush:reelpush@db:5432/reelpush
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      LOCAL_STORAGE_PATH: /storage
    volumes:
      - ./backend:/app
      - ./storage:/storage
    ports:
      - "8100:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      API_URL: http://localhost:8100
      DATABASE_URL: postgresql+asyncpg://reelpush:reelpush@db:5432/reelpush
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      LOCAL_STORAGE_PATH: /storage
    volumes:
      - ./backend:/app
      - ./storage:/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      API_URL: http://localhost:8100
      DATABASE_URL: postgresql+asyncpg://reelpush:reelpush@db:5432/reelpush
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      LOCAL_STORAGE_PATH: /storage
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app beat --loglevel=info

volumes:
  postgres_data:
